sonar.projectKey=Gestion-de-Eventos
sonar.projectName=Gestión de Eventos
sonar.host.url=http://localhost:9000

sonar.sources=.
sonar.exclusions=**/node_modules/**,coverage/**,tests/**,public/uploads/**,frontend/dist/**,__mocks__/**,jest.setup.js

sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# El reporte lo genera "npm run test:coverage"; hay que ejecutarlo ANTES de sonar-scanner
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Sin cobertura: arranque del servidor, el frontend React (no tiene pruebas automáticas) y los puertos,
# que son solo contratos (clases abstractas sin lógica)
sonar.coverage.exclusions=server.js,public/**,frontend/**,src/application/ports/**